spring:
  application:
    name: collaboration-service

server:
  port: ${SERVER_PORT:8085}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-in-production-min-256-bits-long-string-here-please}
  session-service:
    uri: ${SESSION_SERVICE_URI:http://localhost:8084}
  collab:
    room-idle-eviction: ${COLLAB_ROOM_IDLE_EVICTION:PT15M}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.diploma: INFO
