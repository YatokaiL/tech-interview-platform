spring:
  application:
    name: analysis-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/interview_platform?currentSchema=analysis_service}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: analysis_service
        jdbc:
          time_zone: UTC

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: analysis_service
    liquibase-schema: analysis_service

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false

server:
  port: ${SERVER_PORT:8087}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-in-production-min-256-bits-long-string-here-please}
  session-service:
    uri: ${SESSION_SERVICE_URI:http://localhost:8084}
  analysis:
    parallelism: ${ANALYSIS_PARALLELISM:4}
    checkstyle-config: classpath:checkstyle-default.xml
    pmd-ruleset: classpath:pmd-default-ruleset.xml
    max-issues: ${ANALYSIS_MAX_ISSUES:200}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.diploma: INFO
    net.sourceforge.pmd: WARN
    com.puppycrawl.tools.checkstyle: WARN
