spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              "[/**]":
                allowed-origin-patterns:
                  - "http://localhost:*"
                  - "http://127.0.0.1:*"
                allowed-methods: "*"
                allowed-headers: "*"
                allow-credentials: true
                max-age: 3600
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URI:http://auth-service:8081}
              predicates:
                - Path=/api/auth/**

            - id: user-service-users
              uri: ${USER_SERVICE_URI:http://user-service:8082}
              predicates:
                - Path=/api/users/**

            - id: user-service-companies
              uri: ${USER_SERVICE_URI:http://user-service:8082}
              predicates:
                - Path=/api/companies/**

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-in-production-min-256-bits-long-string-here-please}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

logging:
  level:
    com.diploma: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
