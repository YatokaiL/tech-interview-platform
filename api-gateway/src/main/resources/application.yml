spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              "[/**]":
                allowed-origin-patterns:
                  - "http://localhost:*"
                  - "http://127.0.0.1:*"
                allowed-methods: "*"
                allowed-headers: "*"
                allow-credentials: true
                max-age: 3600
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URI:http://auth-service:8081}
              predicates:
                - Path=/api/auth/**

            - id: user-service-users
              uri: ${USER_SERVICE_URI:http://user-service:8082}
              predicates:
                - Path=/api/users/**

            - id: user-service-companies
              uri: ${USER_SERVICE_URI:http://user-service:8082}
              predicates:
                - Path=/api/companies/**

            - id: session-service-sessions
              uri: ${SESSION_SERVICE_URI:http://session-service:8084}
              predicates:
                - Path=/api/sessions/**

            - id: session-service-tasks
              uri: ${SESSION_SERVICE_URI:http://session-service:8084}
              predicates:
                - Path=/api/tasks/**

            - id: session-service-task-categories
              uri: ${SESSION_SERVICE_URI:http://session-service:8084}
              predicates:
                - Path=/api/task-categories/**

            - id: collaboration-service-ws
              uri: ${COLLABORATION_SERVICE_WS_URI:ws://collaboration-service:8085}
              predicates:
                - Path=/ws/sessions/**

            - id: execution-service
              uri: ${EXECUTION_SERVICE_URI:http://execution-service:8086}
              predicates:
                - Path=/api/executions/**

            - id: analysis-service
              uri: ${ANALYSIS_SERVICE_URI:http://analysis-service:8087}
              predicates:
                - Path=/api/analyses/**

            - id: review-service
              uri: ${REVIEW_SERVICE_URI:http://review-service:8088}
              predicates:
                - Path=/api/reviews/**

            - id: report-service
              uri: ${REPORT_SERVICE_URI:http://report-service:8089}
              predicates:
                - Path=/api/reports/**

            - id: subscription-service-tariffs
              uri: ${SUBSCRIPTION_SERVICE_URI:http://subscription-service:8083}
              predicates:
                - Path=/api/tariffs/**

            - id: subscription-service-subscriptions
              uri: ${SUBSCRIPTION_SERVICE_URI:http://subscription-service:8083}
              predicates:
                - Path=/api/subscriptions/**

            - id: subscription-service-payments
              uri: ${SUBSCRIPTION_SERVICE_URI:http://subscription-service:8083}
              predicates:
                - Path=/api/payments/**

            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URI:http://notification-service:8090}
              predicates:
                - Path=/api/notifications/**

            - id: analytics-service
              uri: ${ANALYTICS_SERVICE_URI:http://analytics-service:8091}
              predicates:
                - Path=/api/analytics/**

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-in-production-min-256-bits-long-string-here-please}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

logging:
  level:
    com.diploma: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
