spring:
  application:
    name: execution-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/interview_platform?currentSchema=execution_service}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: execution_service
        jdbc:
          time_zone: UTC

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: execution_service
    liquibase-schema: execution_service

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false

server:
  port: ${SERVER_PORT:8086}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-in-production-min-256-bits-long-string-here-please}
  session-service:
    uri: ${SESSION_SERVICE_URI:http://localhost:8084}
  docker:
    host: ${DOCKER_HOST_URI:unix:///var/run/docker.sock}
    pull-on-startup: ${DOCKER_PULL_ON_STARTUP:false}
  execution:
    parallelism: ${EXECUTION_PARALLELISM:4}
    timeout: ${EXECUTION_TIMEOUT:PT15S}
    memory-bytes: ${EXECUTION_MEMORY_BYTES:268435456}
    cpu-quota: ${EXECUTION_CPU_QUOTA:50000}
    cpu-period: ${EXECUTION_CPU_PERIOD:100000}
    pids-limit: ${EXECUTION_PIDS_LIMIT:64}
    stdout-truncate-bytes: ${EXECUTION_STDOUT_TRUNCATE:65536}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.diploma: INFO
    com.github.dockerjava: WARN
