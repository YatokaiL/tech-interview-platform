services:

  # ─── Infrastructure ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: diploma-postgres
    environment:
      POSTGRES_DB: interview_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - interview-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interview_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: diploma-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - interview-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: diploma-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - interview-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-init:
    image: apache/kafka:3.7.0
    container_name: diploma-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic user-registered        --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic session-created        --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic session-completed      --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic review-completed       --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payment-received       --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic code-executed          --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic analysis-completed    --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic notification-requested --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic analytics-event        --partitions 3 --replication-factor 1 &&
        echo 'All Kafka topics created'
      "
    networks:
      - interview-net

  minio:
    image: minio/minio:latest
    container_name: diploma-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - interview-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 20s

  minio-init:
    image: minio/mc:latest
    container_name: diploma-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set minio http://minio:9000 minioadmin minioadmin123 &&
        mc mb --ignore-existing minio/reports &&
        mc mb --ignore-existing minio/attachments &&
        echo 'MinIO buckets created'
      "
    networks:
      - interview-net

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: diploma-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - interview-net

  # ─── Application services ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    container_name: diploma-frontend
    ports:
      - "3000:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - interview-net

  api-gateway:
    build:
      context: ./api-gateway
    container_name: diploma-api-gateway
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      AUTH_SERVICE_URI: http://auth-service:8081
      USER_SERVICE_URI: http://user-service:8082
      SESSION_SERVICE_URI: http://session-service:8084
      COLLABORATION_SERVICE_WS_URI: ws://collaboration-service:8085
      EXECUTION_SERVICE_URI: http://execution-service:8086
      ANALYSIS_SERVICE_URI: http://analysis-service:8087
      REVIEW_SERVICE_URI: http://review-service:8088
      REPORT_SERVICE_URI: http://report-service:8089
      JWT_SECRET: dev-secret-change-me-in-production-min-256-bits-long-string-here-please
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      session-service:
        condition: service_healthy
      collaboration-service:
        condition: service_healthy
      execution-service:
        condition: service_started
      analysis-service:
        condition: service_started
      review-service:
        condition: service_started
      report-service:
        condition: service_started
    networks:
      - interview-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  user-service:
    build:
      context: ./user-service
    container_name: diploma-user-service
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/interview_platform?currentSchema=auth_service
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: dev-secret-change-me-in-production-min-256-bits-long-string-here-please
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - interview-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  auth-service:
    build:
      context: ./auth-service
    container_name: diploma-auth-service
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/interview_platform?currentSchema=auth_service
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: dev-secret-change-me-in-production-min-256-bits-long-string-here-please
      JWT_ACCESS_TTL: PT15M
      JWT_REFRESH_TTL: P30D
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - interview-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  session-service:
    build:
      context: ./session-service
    container_name: diploma-session-service
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/interview_platform?currentSchema=session_service
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: dev-secret-change-me-in-production-min-256-bits-long-string-here-please
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - interview-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  collaboration-service:
    build:
      context: ./collaboration-service
    container_name: diploma-collaboration-service
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      SESSION_SERVICE_URI: http://session-service:8084
      JWT_SECRET: dev-secret-change-me-in-production-min-256-bits-long-string-here-please
    depends_on:
      session-service:
        condition: service_healthy
    networks:
      - interview-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  execution-service:
    build:
      context: ./execution-service
    container_name: diploma-execution-service
    ports:
      - "8086:8086"
    environment:
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/interview_platform?currentSchema=execution_service
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SESSION_SERVICE_URI: http://session-service:8084
      JWT_SECRET: dev-secret-change-me-in-production-min-256-bits-long-string-here-please
      # On Linux: use the mounted unix socket below.
      # On Windows Docker Desktop the socket mount is flaky; enable the TCP daemon
      # toggle in Docker Desktop (Settings -> General -> "Expose daemon on tcp://localhost:2375 without TLS")
      # and override via .env: DOCKER_HOST_URI=tcp://host.docker.internal:2375
      DOCKER_HOST_URI: ${DOCKER_HOST_URI:-unix:///var/run/docker.sock}
      DOCKER_PULL_ON_STARTUP: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      session-service:
        condition: service_healthy
    networks:
      - interview-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  analysis-service:
    build:
      context: ./analysis-service
    container_name: diploma-analysis-service
    ports:
      - "8087:8087"
    environment:
      SERVER_PORT: 8087
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/interview_platform?currentSchema=analysis_service
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SESSION_SERVICE_URI: http://session-service:8084
      JWT_SECRET: dev-secret-change-me-in-production-min-256-bits-long-string-here-please
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      session-service:
        condition: service_healthy
    networks:
      - interview-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  ollama:
    image: ollama/ollama:latest
    container_name: diploma-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - interview-net
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ollama-init:
    image: ollama/ollama:latest
    container_name: diploma-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint:
      - sh
      - -c
      - |
        echo "Pulling ${OLLAMA_MODEL:-qwen2.5-coder:1.5b} (one-time, ~1 GB)..."
        ollama pull "${OLLAMA_MODEL:-qwen2.5-coder:1.5b}"
        echo "Model ready."
    networks:
      - interview-net
    restart: "no"

  review-service:
    build:
      context: ./review-service
    container_name: diploma-review-service
    ports:
      - "8088:8088"
    environment:
      SERVER_PORT: 8088
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/interview_platform?currentSchema=review_service
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SESSION_SERVICE_URI: http://session-service:8084
      EXECUTION_SERVICE_URI: http://execution-service:8086
      ANALYSIS_SERVICE_URI: http://analysis-service:8087
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5-coder:1.5b}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      JWT_SECRET: dev-secret-change-me-in-production-min-256-bits-long-string-here-please
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      session-service:
        condition: service_healthy
    networks:
      - interview-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  report-service:
    build:
      context: ./report-service
    container_name: diploma-report-service
    ports:
      - "8089:8089"
    environment:
      SERVER_PORT: 8089
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/interview_platform?currentSchema=report_service
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SESSION_SERVICE_URI: http://session-service:8084
      REVIEW_SERVICE_URI: http://review-service:8088
      USER_SERVICE_URI: http://user-service:8082
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: reports
      JWT_SECRET: dev-secret-change-me-in-production-min-256-bits-long-string-here-please
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      session-service:
        condition: service_healthy
      review-service:
        condition: service_started
    networks:
      - interview-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Remaining services to wire (not yet implemented):
  #   subscription-service:  8083
  #   notification-service:  8090
  #   analytics-service:     8091

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  minio_data:
  ollama_data:

networks:
  interview-net:
    driver: bridge
